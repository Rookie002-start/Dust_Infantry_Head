# board_dm_mc02 板级配置
CONFIG_HAS_CMSIS_CORE=y

# FDCAN FD 模式：仲裁段 1Mbps / 数据段 2Mbps（与 overlay 的 bitrate-data 对应）
# CAN_FD_MODE 依赖 CAN 子系统，故此处一并打开
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# 上下板通信线程（fdcan2 / user-can2）— 仅本板有该总线，故按板级开启
#   CONFIG_TRD_MCU_INTER = 发送（持有总线：Init + 收帧分发入口）
#   CONFIG_TRD_INTER_RX  = 接收（只注册 CAN_RX_HANDLER）
CONFIG_TRD_MCU_INTER=y
CONFIG_TRD_INTER_RX=y
