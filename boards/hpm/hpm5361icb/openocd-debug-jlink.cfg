# HPM5361ICB 调试用 OpenOCD 配置（J-Link / JTAG）—— 备用
#
# 目前 .vscode/launch.json 的 HPM 调试项走 CMSIS-DAP（见 openocd-debug.cfg）。
# 哪天换回 J-Link：把 launch.json 里那两处
#   ${workspaceFolder}/boards/hpm/hpm5361icb/openocd-debug.cfg
# 改成
#   ${workspaceFolder}/boards/hpm/hpm5361icb/openocd-debug-jlink.cfg
# 并把 debugServerPath 从 openocd-cmsis-dap-wrapper.sh 改回 /home/rookie/openocd-hpm/bin/openocd
# （J-Link 不需要那套 USB 复位/解绑）。
#
# 由 VS Code 这样拉起：
#   openocd -s <hpm_sdk>/boards/openocd -f <本文件>

source [find probes/jlink.cfg]
adapter speed 4000

source [find soc/hpm5300.cfg]
source [find boards/hpm5300evk.cfg]
