# HPM5361ICB — 芯片层配置
CONFIG_MCAN_HPMICRO=y
CONFIG_DMA=y
CONFIG_DMAV2_HPMICRO=y
CONFIG_ROM_START_OFFSET=0x3100
CONFIG_SOC_ANDES_V5_PMA=y
CONFIG_HPM53_SINGLE_PRECISION_FPU=y
CONFIG_NOCACHE_MEMORY=y

CONFIG_DUST_MOD_DEV_IMU_ICM42688P=n

# ---- CAN FD（上下板通信总线：仲裁段 1Mbps / 数据段 2Mbps，FDF + BRS）--------
# 必须打开。不开的话 Zephyr 侧 CAN_MAX_DLEN 只有 8（经典 CAN 上限），后果是：
#   1) trd_mcu_inter.cpp 的 SendFrame() 里 `len > CAN_MAX_DLEN` 对 63B 聚合帧
#      永远成立，-O2 下整条发送路径（连那句 "can tx busy" 日志一起）被判为
#      死代码删除 —— 现象是"一帧都发不出去，而且什么日志都没有"；
#   2) Can::Init() 的 can_set_mode(CAN_MODE_FD) 会返回 -ENOTSUP，控制器停在
#      经典 CAN 模式（CCCR.FDOE=0）；
#   3) hpm_mcan_init() 里那个 `if (config->enable_canfd)` 分支不会执行，
#      DBTP（数据段位时序）根本没被写过，一直是芯片复位默认值。
# 各节点的位率在 hpm5361icb.overlay 的 &mcanX 里给，见 &mcan3。
CONFIG_CAN_FD_MODE=y
# 数据段位率默认值（overlay 里节点的 bitrate-data 会覆盖它）；
# 上下板总线固定 1M/2M，这里给 2M 以免漏写 DT 属性时静默变成别的值。
CONFIG_CAN_DEFAULT_BITRATE_DATA=2000000

# PC 自瞄链路（USB CDC ACM，pc-usb = &qingyuusb_usb0）— 仅本板有 USB，故按板级开启
#   CONFIG_DUST_USB_DEVICE_HAL_HPM：USB 设备栈的 HPM HAL（EHC/CherryUSB 分层里的 HAL 层）
#   CONFIG_TRD_PC                  ：PC 链路线程（收自瞄转下板 + 发 IMU）
CONFIG_DUST_USB_DEVICE_HAL_HPM=y

# SEGGER RTT 调试通道（板级打开：prj.conf 里是 n，rm_c 板不受影响）
#   RISC-V 平台上 Zephyr 会把控制块放进普通 .bss（SEGGER_RTT_SECTION_CUSTOM 仅 Cortex-M 可选），
#   主机侧按 ELF 里的 _SEGGER_RTT 符号寻址即可，见 tools/rtt.sh / docs/segger_rtt.md
CONFIG_DEBUG_RTT=y
