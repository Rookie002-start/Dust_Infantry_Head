# HPM5361ICB 调试用 OpenOCD 配置（Horco CMSIS-DAP / JTAG）
#
# 供 .vscode/launch.json 的 "HPM5361 调试 (DAP JTAG)" 使用，由 VS Code 这样拉起：
#   boards/hpm/hpm5361icb/openocd-cmsis-dap-wrapper.sh -s <hpm_sdk>/boards/openocd -f <本文件>
#
# 走 wrapper 的原因（与 west flash 一致）：先杀残留 openocd、复位探针 USB、
# 解绑 cdc_acm，并确认探针能应答 CMSIS-DAP 命令，再调 ~/openocd-hpm/bin/openocd。
# 这支探针会偶发"字符串描述符假死"，不复位的话调试会起不来。
#
# 必需的搜索路径由 launch.json 的 debugServerArgs 里的 -s 提供，
# 与 boards/hpm/hpm5361icb/board.cmake / runners.yaml 保持一致。
#
# 想换回 J-Link：用同目录的 openocd-debug-jlink.cfg

source [find probes/cmsis_dap.cfg]

# 实测 4000 kHz 已到这支探针的饱和点（依据见 board.cmake 注释），
# 再高不会更快；长排线上若报错可调小。
adapter speed 4000

source [find soc/hpm5300.cfg]
source [find boards/hpm5300evk.cfg]

# hpm5300evk.cfg 里默认给 gdb attach 挂了 "reset halt"：
#   $_TARGET0 configure -event gdb-attach { reset halt }
# 也就是任何 gdb 连上来都会先把板子复位 —— 那是烧录/启动调试想要的行为，
# 但 "HPM5361 附加 (DAP JTAG)" 的语义是"不动现场贴上去"，所以这里清掉。
# launch 配置不受影响：它自己会显式发 monitor reset init。
$_TARGET0 configure -event gdb-attach {}

# gdb 断开（VS Code 里"停止调试"）时让目标继续跑，别把板子留在 halt 状态。
# 控制器这类固件停在 halt 上等于机构失控，默认恢复运行更安全。
$_TARGET0 configure -event gdb-detach { resume }

# 把 RISC-V 的异常相关 CSR 暴露给 gdb，崩溃取证时可以直接读：
#   0x300 mstatus, 0x341 mepc（出错指令地址）, 0x342 mcause（异常原因）, 0x343 mtval（附加信息）
# 读法：gdb 里 info all-registers 找 csr 开头的名字，或 p/x $csr0x342 之类。
riscv expose_csrs 0x300 0x341 0x342 0x343
